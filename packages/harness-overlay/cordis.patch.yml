- id: llm-pi-ai
  # The staged base mounts Minke's wrapper at the native settings address.
  # `name` asserts that composition; Cordis patches cannot replace a module.
  name: '@lencx/minke-model-runtime/dsh'

# Enable DSH's existing opt-in entries; do not declare duplicate instances.
- id: time-context
  disabled: false

- id: schedule
  disabled: false

- insert:
    # This is an additional credential-free tool, not a provider override.
    # Keep DSH's native web_search/web_fetch composition and provider selection
    # intact, including its credentials, retry UI, and structured failures.
    - id: minke-web-search
      name: '@lencx/minke-harness-overlay/web-search'
      disabled: !!js process.env.MINKE_WEB_SEARCH_FALLBACK_ENABLED === '0'
      config:
        baseURL: !!js process.env.MINKE_WEB_SEARCH_BASE_URL

    - id: minke-overlay
      name: '@lencx/minke-harness-overlay'
      config:
        rootPath: !!js process.env.MINKE_HOST_ROOT

- id: ui-schedule
  disabled: false
